## This workflow will scan pull requests and pushed for files that do not
## have the proper license.

name: Check license header
run-name: "Check license header ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
permissions:
  contents: read
  pull-requests: read

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
            fetch-depth: '0'
            persist-credentials: false
      - uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # ratchet:erlef/setup-beam@v1.20.4
        with:
            otp-version: '27'

      - name: License Compliance Check all files
        run: ./scripts/license-header.es ci

      - name: Check that copyright update works as it should
        run: |
          ./scripts/license-header.es update
          ./scripts/license-header.es ci
